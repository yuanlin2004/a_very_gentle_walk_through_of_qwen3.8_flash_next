<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-label="MTP drafter: the final residual at token t, normalized across all lanes, and the normalized embedding of token t+1 are projected and summed into four lanes; one QSA layer and one MoE layer with their own weights follow, then a final mixer and the shared head guess token t+2; drafts chain on the MTP&#x27;s own residual"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="20" y="23" width="170" height="84" rx="6"/><text textLength="158" lengthAdjust="spacingAndGlyphs" class="t" x="105.0" y="47" text-anchor="middle">final R at token t</text><text class="m" x="105.0" y="69" text-anchor="middle">4 × 2,560</text><text textLength="158" lengthAdjust="spacingAndGlyphs" class="m" x="105.0" y="91" text-anchor="middle">(before the final mixer)</text><rect class="dat" x="20" y="139" width="170" height="62" rx="6"/><text class="t" x="105.0" y="163" text-anchor="middle">embed(x<tspan baseline-shift="sub" font-size="75%">t+1</tspan>)</text><text class="m" x="105.0" y="185" text-anchor="middle">shared embedding</text><rect class="ok" x="220" y="28" width="210" height="84" rx="6"/><text class="t" x="325.0" y="52" text-anchor="middle">norm over all 10,240</text><text class="m" x="325.0" y="74" text-anchor="middle">then W<tspan baseline-shift="sub" font-size="75%">fh</tspan> per lane</text><text class="m" x="325.0" y="96" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">fh</tspan> 2,560 × 2,560</text><rect class="ok" x="220" y="135" width="210" height="70" rx="6"/><text class="t" x="325.0" y="163" text-anchor="middle">norm, then W<tspan baseline-shift="sub" font-size="75%">fe</tspan></text><text class="m" x="325.0" y="185" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">fe</tspan> 2,560 × 2,560</text><polyline class="ar" points="190,65 218,65" marker-end="url(#ah9)"/><polyline class="ar" points="190,170 218,170" marker-end="url(#ah9)"/><rect class="ok" x="460" y="80" width="120" height="70" rx="6"/><text class="t" x="520.0" y="108" text-anchor="middle">sum</text><text textLength="108" lengthAdjust="spacingAndGlyphs" class="m" x="520.0" y="130" text-anchor="middle">into each lane</text><polyline class="ar" points="430,70 445,70 445,105 458,105" marker-end="url(#ah9)"/><polyline class="ar" points="430,170 445,170 445,125 458,125" marker-end="url(#ah9)"/><rect class="ok" x="610" y="50" width="240" height="130" rx="6"/><text class="t" x="730.0" y="75" text-anchor="middle">one layer, own weights</text><text class="m" x="730.0" y="97" text-anchor="middle">GR → QSA (own cache)</text><text class="m" x="730.0" y="119" text-anchor="middle">GR → MoE: 512 experts</text><text class="m" x="730.0" y="141" text-anchor="middle">(FP8 as shipped) + shared</text><text class="m" x="730.0" y="163" text-anchor="middle">→ final mixer</text><polyline class="ar" points="580,115 608,115" marker-end="url(#ah9)"/><rect class="ok" x="880" y="80" width="200" height="70" rx="6"/><text class="t" x="980.0" y="108" text-anchor="middle">shared head</text><text class="m" x="980.0" y="130" text-anchor="middle">argmax → draft x<tspan baseline-shift="sub" font-size="75%">t+2</tspan></text><polyline class="ar" points="850,115 878,115" marker-end="url(#ah9)"/><polyline class="ar dash" points="730,180 730,240 105,240 105,202" marker-end="url(#ah9)"/><text class="al" x="420" y="232" text-anchor="middle">draft k+1: the MTP&#x27;s own residual and embed(draft k)</text><text class="m" x="20" y="280" text-anchor="start">The backbone then checks the drafts in one pass; a draft only counts if it equals the backbone&#x27;s own choice.</text></svg>