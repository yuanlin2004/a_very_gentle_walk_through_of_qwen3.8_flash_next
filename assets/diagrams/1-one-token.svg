<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-label="Flash-Next forward pass for one token: embedding into four residual lanes, 48 layers of a token mixer half and a MoE half each wrapped by a hyper-connection, the n-gram embedding added before layer 1, the final mixer and the head; the MTP layer predicts one more token"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 11px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 13px Helvetica,Arial,sans-serif}text.m{font:11px Menlo,monospace;fill:#5a6476}text.al{font:11px Menlo,monospace;fill:#2c56c9}text.gt{font:600 13px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="host2" x="20" y="225" width="110" height="60" rx="6"/><text class="t" x="75.0" y="251.5" text-anchor="middle">token x_t</text><text class="m" x="75.0" y="266.5" text-anchor="middle">id &lt; 248,320</text><rect class="ok" x="155" y="215" width="150" height="80" rx="6"/><text class="t" x="230.0" y="244.0" text-anchor="middle">embedding</text><text class="m" x="230.0" y="259.0" text-anchor="middle">row E[x_t], 2,560</text><text class="m" x="230.0" y="274.0" text-anchor="middle">copied into 4 lanes</text><polyline class="ar" points="130,255 153,255" marker-end="url(#ah1)"/><rect class="dat" x="330" y="225" width="110" height="60" rx="6"/><text class="t" x="385.0" y="251.5" text-anchor="middle">R</text><text class="m" x="385.0" y="266.5" text-anchor="middle">4 lanes × 2,560</text><polyline class="ar" points="305,255 328,255" marker-end="url(#ah1)"/><rect class="grp" x="470" y="60" width="400" height="420" rx="10"/><text class="gt" x="482" y="80">one layer (48 of them)</text><rect class="wt" x="490" y="95" width="360" height="52" rx="6"/><text class="t" x="670.0" y="117.5" text-anchor="middle">n-gram embedding (PLE), layer 1 only</text><text class="m" x="670.0" y="132.5" text-anchor="middle">16 hashed rows of t−2, t−1, t, added into R</text><rect class="ok" x="490" y="170" width="110" height="60" rx="6"/><text class="t" x="545.0" y="196.5" text-anchor="middle">GR read</text><text class="m" x="545.0" y="211.5" text-anchor="middle">x = mix of lanes</text><rect class="ok" x="625" y="165" width="225" height="70" rx="6"/><text class="t" x="737.5" y="189.0" text-anchor="middle">token mixer</text><text class="m" x="737.5" y="204.0" text-anchor="middle">GDN at 36 layers (l mod 4 ≠ 3)</text><text class="m" x="737.5" y="219.0" text-anchor="middle">QSA at 12 layers (l mod 4 = 3)</text><rect class="ok" x="490" y="250" width="360" height="40" rx="6"/><text class="t" x="670.0" y="274.0" text-anchor="middle">GR write: R_i += s_i · y for each lane i</text><rect class="ok" x="490" y="315" width="110" height="60" rx="6"/><text class="t" x="545.0" y="341.5" text-anchor="middle">GR read</text><text class="m" x="545.0" y="356.5" text-anchor="middle">x = mix of lanes</text><rect class="ok" x="625" y="310" width="225" height="70" rx="6"/><text class="t" x="737.5" y="334.0" text-anchor="middle">MoE</text><text class="m" x="737.5" y="349.0" text-anchor="middle">10 of 512 experts</text><text class="m" x="737.5" y="364.0" text-anchor="middle">+ 1 shared expert</text><rect class="ok" x="490" y="395" width="360" height="40" rx="6"/><text class="t" x="670.0" y="419.0" text-anchor="middle">GR write: R_i += s_i · y for each lane i</text><polyline class="ar" points="600,200 623,200" marker-end="url(#ah1)"/><text class="al" x="611" y="192" text-anchor="middle">x</text><polyline class="ar" points="737,235 737,248" marker-end="url(#ah1)"/><polyline class="ar" points="600,345 623,345" marker-end="url(#ah1)"/><text class="al" x="611" y="337" text-anchor="middle">x</text><polyline class="ar" points="737,380 737,393" marker-end="url(#ah1)"/><polyline class="ar" points="545,147 545,168" marker-end="url(#ah1)"/><polyline class="ar" points="545,290 545,313" marker-end="url(#ah1)"/><text class="al" x="490" y="462" text-anchor="start">pattern 12 × [GDN, GDN, GDN, QSA]; R flows layer to layer</text><polyline class="ar" points="440,255 468,255" marker-end="url(#ah1)"/><rect class="ok" x="900" y="215" width="120" height="80" rx="6"/><text class="t" x="960.0" y="244.0" text-anchor="middle">final mixer</text><text class="m" x="960.0" y="259.0" text-anchor="middle">GR read only</text><text class="m" x="960.0" y="274.0" text-anchor="middle">h, 2,560</text><polyline class="ar" points="870,255 898,255" marker-end="url(#ah1)"/><rect class="ok" x="900" y="330" width="120" height="60" rx="6"/><text class="t" x="960.0" y="356.5" text-anchor="middle">head</text><text class="m" x="960.0" y="371.5" text-anchor="middle">248,320 × 2,560</text><polyline class="ar" points="960,295 960,328" marker-end="url(#ah1)"/><rect class="host2" x="900" y="420" width="120" height="60" rx="6"/><text class="t" x="960.0" y="446.5" text-anchor="middle">logits</text><text class="m" x="960.0" y="461.5" text-anchor="middle">→ token x_t+1</text><polyline class="ar" points="960,390 960,418" marker-end="url(#ah1)"/><rect class="spec" x="900" y="60" width="200" height="100" rx="6"/><text class="t" x="1000.0" y="91.5" text-anchor="middle">MTP layer (drafter)</text><text class="m" x="1000.0" y="106.5" text-anchor="middle">final R + embed(x_t+1)</text><text class="m" x="1000.0" y="121.5" text-anchor="middle">→ one more QSA + MoE layer</text><text class="m" x="1000.0" y="136.5" text-anchor="middle">→ head: guess at x_t+2</text><polyline class="ar dash" points="885,255 885,110 898,110" marker-end="url(#ah1)"/><text class="al" x="20" y="30" text-anchor="start">Every block reads the 4-lane residual R through a hyper-connection (GR) read and adds its output back to each lane with its own scale.</text><text class="m" x="20" y="520" text-anchor="start">One token&#x27;s forward pass. GDN and QSA carry state from earlier tokens (GDN: a fixed-size matrix per head; QSA: a key/value cache).</text><text class="m" x="20" y="540" text-anchor="start">Sizes: hidden 2,560, vocab 248,320; about 125.7 B parameters plus a 51.2 B-entry n-gram table, about 6.7 B used per token (inferred).</text></svg>