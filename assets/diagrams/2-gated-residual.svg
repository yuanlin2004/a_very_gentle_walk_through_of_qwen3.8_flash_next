<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-label="Hyper-connection site: per-lane RMSNorm, a 320-wide bottleneck gives per-element lane weights, the block input is their weighted mean, and four lane scales decide how much of the block output each lane receives"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="20" y="50" width="130" height="70" rx="6"/><text class="t" x="85.0" y="78" text-anchor="middle">R</text><text textLength="118" lengthAdjust="spacingAndGlyphs" class="m" x="85.0" y="100" text-anchor="middle">4 lanes × 2,560</text><rect class="ok" x="180" y="43" width="180" height="84" rx="6"/><text class="t" x="270.0" y="67" text-anchor="middle">RMSNorm per lane</text><text textLength="168" lengthAdjust="spacingAndGlyphs" class="m" x="270.0" y="89" text-anchor="middle">Rn<tspan baseline-shift="sub" font-size="75%">i</tspan> = norm(R<tspan baseline-shift="sub" font-size="75%">i</tspan>)·(1+γ<tspan baseline-shift="sub" font-size="75%">i</tspan>)</text><text class="m" x="270.0" y="111" text-anchor="middle">γ: 4 × 2,560</text><rect class="ok" x="390" y="40" width="170" height="90" rx="6"/><text class="t" x="475.0" y="67" text-anchor="middle">bottleneck</text><text textLength="158" lengthAdjust="spacingAndGlyphs" class="m" x="475.0" y="89" text-anchor="middle">t = silu(W<tspan baseline-shift="sub" font-size="75%">down</tspan> Rn / 4)</text><text class="m" x="475.0" y="111" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">down</tspan> 320 × 10,240</text><rect class="ok" x="590" y="32" width="170" height="106" rx="6"/><text class="t" x="675.0" y="56" text-anchor="middle">lane weights</text><text class="m" x="675.0" y="78" text-anchor="middle">G = σ(W<tspan baseline-shift="sub" font-size="75%">up</tspan> t)</text><text class="m" x="675.0" y="100" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">up</tspan> 10,240 × 320</text><text class="m" x="675.0" y="122" text-anchor="middle">G: 4 × 2,560</text><rect class="dat" x="780" y="43" width="165" height="84" rx="6"/><text class="t" x="862.5" y="67" text-anchor="middle">block input</text><text class="m" x="862.5" y="89" text-anchor="middle">x = ¼ Σ<tspan baseline-shift="sub" font-size="75%">i</tspan> G<tspan baseline-shift="sub" font-size="75%">i</tspan> ⊙ Rn<tspan baseline-shift="sub" font-size="75%">i</tspan></text><text class="m" x="862.5" y="111" text-anchor="middle">2,560</text><rect class="host2" x="965" y="40" width="120" height="90" rx="6"/><text class="t" x="1025.0" y="67" text-anchor="middle">block f</text><text textLength="108" lengthAdjust="spacingAndGlyphs" class="m" x="1025.0" y="89" text-anchor="middle">GDN, QSA, MoE</text><text textLength="108" lengthAdjust="spacingAndGlyphs" class="m" x="1025.0" y="111" text-anchor="middle">y = f(x): 2,560</text><polyline class="ar" points="150,85 178,85" marker-end="url(#ah2)"/><polyline class="ar" points="360,85 388,85" marker-end="url(#ah2)"/><polyline class="ar" points="560,85 588,85" marker-end="url(#ah2)"/><polyline class="ar" points="760,85 778,85" marker-end="url(#ah2)"/><polyline class="ar" points="945,85 963,85" marker-end="url(#ah2)"/><rect class="ok" x="370" y="283" width="210" height="84" rx="6"/><text class="t" x="475.0" y="307" text-anchor="middle">lane scales</text><text class="m" x="475.0" y="329" text-anchor="middle">s = 2σ(W<tspan baseline-shift="sub" font-size="75%">inj</tspan> Rn / 4)</text><text class="m" x="475.0" y="351" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">inj</tspan> 4 × 10,240</text><rect class="dat" x="605" y="294" width="160" height="62" rx="6"/><text class="t" x="685.0" y="318" text-anchor="middle">s</text><text textLength="148" lengthAdjust="spacingAndGlyphs" class="m" x="685.0" y="340" text-anchor="middle">4 values in (0, 2)</text><rect class="ok" x="790" y="283" width="290" height="84" rx="6"/><text class="t" x="935.0" y="307" text-anchor="middle">write back</text><text class="m" x="935.0" y="329" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">i</tspan> ← R<tspan baseline-shift="sub" font-size="75%">i</tspan> + s<tspan baseline-shift="sub" font-size="75%">i</tspan> · y</text><text class="m" x="935.0" y="351" text-anchor="middle">for each lane i = 0..3</text><polyline class="ar" points="270,125 270,325 368,325" marker-end="url(#ah2)"/><text class="al" x="290" y="245" text-anchor="middle">Rn: 10,240</text><polyline class="ar" points="580,325 603,325" marker-end="url(#ah2)"/><polyline class="ar" points="765,325 788,325" marker-end="url(#ah2)"/><polyline class="ar" points="1025,130 1025,288" marker-end="url(#ah2)"/><text class="al" x="1017" y="240" text-anchor="end">y: 2,560</text><polyline class="ar dash" points="935,360 935,400 85,400 85,122" marker-end="url(#ah2)"/><text class="al" x="500" y="392" text-anchor="middle">updated R: 4 × 2,560 → next site</text><text class="al" x="20" y="25" text-anchor="start">97 sites: before each of the 96 layer halves, plus the final mixer (no write back) that feeds the head.</text><path d="M164,91 V143" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="164" y="160" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">4 × 2,560</text><path d="M374,91 V143" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="374" y="160" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">10,240 (flattened)</text><path d="M574,91 V143" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="574" y="160" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">320</text><path d="M769,91 V143" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="769" y="160" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">4 × 2,560</text><path d="M954,91 V143" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="954" y="160" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">2,560</text><path d="M592,320 V277" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="592" y="273" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">4</text><path d="M777,320 V277" fill="none" stroke="#8a94a3" stroke-width="0.8"/><text x="777" y="273" text-anchor="middle" style="font:14px Menlo,monospace;fill:#2c56c9">4</text></svg>