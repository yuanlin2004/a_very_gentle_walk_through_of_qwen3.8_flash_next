<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-label="n-gram hashing: the current token and the two before it are each multiplied by a fixed 64-bit multiplier; XOR of the first two gives the bigram mix, XOR of all three the trigram mix; each of 16 heads reduces its mix modulo its own prime near 20 million and adds its offset, giving one row id per head"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="host2" x="20" y="36.5" width="150" height="62" rx="6"/><text class="t" x="95.0" y="60.5" text-anchor="middle">y<tspan baseline-shift="sub" font-size="75%">0</tspan> = x<tspan baseline-shift="sub" font-size="75%">t</tspan></text><text class="m" x="95.0" y="82.5" text-anchor="middle">current token</text><rect class="host2" x="20" y="111.5" width="150" height="62" rx="6"/><text class="t" x="95.0" y="135.5" text-anchor="middle">y<tspan baseline-shift="sub" font-size="75%">1</tspan> = x<tspan baseline-shift="sub" font-size="75%">t−1</tspan></text><text class="m" x="95.0" y="157.5" text-anchor="middle">or EOS</text><rect class="host2" x="20" y="186.5" width="150" height="62" rx="6"/><text class="t" x="95.0" y="210.5" text-anchor="middle">y<tspan baseline-shift="sub" font-size="75%">2</tspan> = x<tspan baseline-shift="sub" font-size="75%">t−2</tspan></text><text class="m" x="95.0" y="232.5" text-anchor="middle">or EOS</text><rect class="ok" x="200" y="36" width="130" height="62" rx="6"/><text class="t" x="265.0" y="60" text-anchor="middle">× m<tspan baseline-shift="sub" font-size="75%">0</tspan></text><text class="m" x="265.0" y="82" text-anchor="middle">64-bit, wraps</text><polyline class="ar" points="170,67 198,67" marker-end="url(#ah7)"/><rect class="ok" x="200" y="111" width="130" height="62" rx="6"/><text class="t" x="265.0" y="135" text-anchor="middle">× m<tspan baseline-shift="sub" font-size="75%">1</tspan></text><text class="m" x="265.0" y="157" text-anchor="middle">64-bit, wraps</text><polyline class="ar" points="170,142 198,142" marker-end="url(#ah7)"/><rect class="ok" x="200" y="186" width="130" height="62" rx="6"/><text class="t" x="265.0" y="210" text-anchor="middle">× m<tspan baseline-shift="sub" font-size="75%">2</tspan></text><text class="m" x="265.0" y="232" text-anchor="middle">64-bit, wraps</text><polyline class="ar" points="170,217 198,217" marker-end="url(#ah7)"/><rect class="ok" x="370" y="75" width="170" height="70" rx="6"/><text class="t" x="455.0" y="103" text-anchor="middle">bigram mix</text><text textLength="158" lengthAdjust="spacingAndGlyphs" class="m" x="455.0" y="125" text-anchor="middle">(y<tspan baseline-shift="sub" font-size="75%">0</tspan>·m<tspan baseline-shift="sub" font-size="75%">0</tspan>) XOR (y<tspan baseline-shift="sub" font-size="75%">1</tspan>·m<tspan baseline-shift="sub" font-size="75%">1</tspan>)</text><polyline class="ar" points="330,67 350,67 350,100 368,100" marker-end="url(#ah7)"/><polyline class="ar" points="330,142 350,142 350,120 368,120" marker-end="url(#ah7)"/><rect class="ok" x="370" y="178" width="170" height="84" rx="6"/><text class="t" x="455.0" y="202" text-anchor="middle">trigram mix</text><text class="m" x="455.0" y="224" text-anchor="middle">bigram mix</text><text class="m" x="455.0" y="246" text-anchor="middle">XOR (y<tspan baseline-shift="sub" font-size="75%">2</tspan>·m<tspan baseline-shift="sub" font-size="75%">2</tspan>)</text><polyline class="ar" points="455,145 455,183" marker-end="url(#ah7)"/><polyline class="ar" points="330,217 368,217" marker-end="url(#ah7)"/><rect class="grp" x="580" y="20" width="300" height="290" rx="10"/><text class="gt" x="592" y="40">16 heads</text><rect class="ok" x="600" y="47" width="260" height="106" rx="6"/><text class="t" x="730.0" y="71" text-anchor="middle">heads h = 0..7 (bigram)</text><text class="m" x="730.0" y="93" text-anchor="middle">id<tspan baseline-shift="sub" font-size="75%">h</tspan> = (bigram mix mod P<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><text class="m" x="730.0" y="115" text-anchor="middle">      + offset<tspan baseline-shift="sub" font-size="75%">h</tspan></text><text class="m" x="730.0" y="137" text-anchor="middle">8 different primes P<tspan baseline-shift="sub" font-size="75%">h</tspan></text><rect class="ok" x="600" y="187" width="260" height="106" rx="6"/><text class="t" x="730.0" y="211" text-anchor="middle">heads h = 8..15 (trigram)</text><text class="m" x="730.0" y="233" text-anchor="middle">id<tspan baseline-shift="sub" font-size="75%">h</tspan> = (trigram mix mod P<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><text class="m" x="730.0" y="255" text-anchor="middle">      + offset<tspan baseline-shift="sub" font-size="75%">h</tspan></text><text class="m" x="730.0" y="277" text-anchor="middle">8 different primes P<tspan baseline-shift="sub" font-size="75%">h</tspan></text><polyline class="ar" points="540,100 598,100" marker-end="url(#ah7)"/><polyline class="ar" points="540,230 598,230" marker-end="url(#ah7)"/><rect class="wt" x="920" y="106" width="165" height="128" rx="6"/><text class="t" x="1002.5" y="130" text-anchor="middle">table rows</text><text class="m" x="1002.5" y="152" text-anchor="middle">16 ids → 16 rows</text><text textLength="153" lengthAdjust="spacingAndGlyphs" class="m" x="1002.5" y="174" text-anchor="middle">each 160 FP8 values</text><text class="m" x="1002.5" y="196" text-anchor="middle">head h only reads</text><text class="m" x="1002.5" y="218" text-anchor="middle">its own range</text><polyline class="ar" points="880,100 900,100 900,150 918,150" marker-end="url(#ah7)"/><polyline class="ar" points="880,240 900,240 900,190 918,190" marker-end="url(#ah7)"/><text class="m" x="20" y="290" text-anchor="start">m<tspan baseline-shift="sub" font-size="75%">0</tspan>, m<tspan baseline-shift="sub" font-size="75%">1</tspan>, m<tspan baseline-shift="sub" font-size="75%">2</tspan>, P<tspan baseline-shift="sub" font-size="75%">h</tspan> and offset<tspan baseline-shift="sub" font-size="75%">h</tspan> are integers stored in the checkpoint</text><text class="m" x="20" y="308" text-anchor="start">(fixed multipliers, head vocabulary sizes, and head offsets).</text><text class="al" x="20" y="340" text-anchor="start">Different primes make different collisions: two contexts that share a row in one head almost never</text><text class="al" x="20" y="358" text-anchor="start">share it in the other seven, so the 8 rows of an n-gram together are close to unique (inferred).</text></svg>