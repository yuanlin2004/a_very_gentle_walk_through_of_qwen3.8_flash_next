<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-label="Mixture of experts: a softmax router over 512 experts keeps the top 10 and renormalizes their weights; each expert is a SwiGLU with intermediate 640; a shared expert runs for every token with its own sigmoid gate; outputs are summed"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="20" y="140" width="100" height="60" rx="6"/><text class="t" x="70.0" y="166.5" text-anchor="middle">x</text><text class="m" x="70.0" y="181.5" text-anchor="middle">2,560</text><rect class="ok" x="150" y="25" width="220" height="90" rx="6"/><text class="t" x="260.0" y="51.5" text-anchor="middle">router</text><text class="m" x="260.0" y="66.5" text-anchor="middle">p = softmax(W<tspan baseline-shift="sub" font-size="75%">r</tspan> x), 512</text><text class="m" x="260.0" y="81.5" text-anchor="middle">keep the top 10</text><text class="m" x="260.0" y="96.5" text-anchor="middle">w<tspan baseline-shift="sub" font-size="75%">e</tspan> = p<tspan baseline-shift="sub" font-size="75%">e</tspan> / Σ top-10 p</text><polyline class="ar" points="120,170 135,170 135,77 148,77" marker-end="url(#ah5)"/><rect class="ok" x="400" y="20" width="320" height="125" rx="6"/><text class="t" x="560.0" y="56.5" text-anchor="middle">10 routed experts e</text><text textLength="308" lengthAdjust="spacingAndGlyphs" class="m" x="560.0" y="71.5" text-anchor="middle">d<tspan baseline-shift="sub" font-size="75%">e</tspan> = W<tspan baseline-shift="sub" font-size="75%">down,e</tspan> (silu(W<tspan baseline-shift="sub" font-size="75%">gate,e</tspan> x) ⊙ W<tspan baseline-shift="sub" font-size="75%">up,e</tspan> x)</text><text class="m" x="560.0" y="86.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">gate</tspan>, W<tspan baseline-shift="sub" font-size="75%">up</tspan> 640 × 2,560</text><text class="m" x="560.0" y="101.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">down</tspan> 2,560 × 640</text><text class="m" x="560.0" y="116.5" text-anchor="middle">chosen from 512 per layer</text><polyline class="ar" points="370,70 398,70" marker-end="url(#ah5)"/><rect class="ok" x="400" y="200" width="320" height="95" rx="6"/><text class="t" x="560.0" y="236.5" text-anchor="middle">shared expert (every token)</text><text class="m" x="560.0" y="251.5" text-anchor="middle">d<tspan baseline-shift="sub" font-size="75%">s</tspan> = same SwiGLU, own weights</text><text class="m" x="560.0" y="266.5" text-anchor="middle">gate w<tspan baseline-shift="sub" font-size="75%">s</tspan> = σ(w<tspan baseline-shift="sub" font-size="75%">row</tspan> · x), a scalar</text><polyline class="ar" points="135,170 135,247 398,247" marker-end="url(#ah5)"/><polyline class="ar" points="135,170 135,130 398,130" marker-end="url(#ah5)"/><rect class="ok" x="750" y="110" width="170" height="90" rx="6"/><text class="t" x="835.0" y="144.0" text-anchor="middle">sum</text><text class="m" x="835.0" y="159.0" text-anchor="middle">y = Σ<tspan baseline-shift="sub" font-size="75%">e</tspan> w<tspan baseline-shift="sub" font-size="75%">e</tspan> d<tspan baseline-shift="sub" font-size="75%">e</tspan></text><text class="m" x="835.0" y="174.0" text-anchor="middle">+ w<tspan baseline-shift="sub" font-size="75%">s</tspan> d<tspan baseline-shift="sub" font-size="75%">s</tspan></text><polyline class="ar" points="720,82 730,82 730,140 748,140" marker-end="url(#ah5)"/><polyline class="ar" points="720,247 730,247 730,170 748,170" marker-end="url(#ah5)"/><rect class="dat" x="950" y="125" width="130" height="60" rx="6"/><text class="t" x="1015.0" y="151.5" text-anchor="middle">y</text><text class="m" x="1015.0" y="166.5" text-anchor="middle">2,560</text><polyline class="ar" points="920,155 948,155" marker-end="url(#ah5)"/><text class="m" x="20" y="325" text-anchor="start">Every layer has one. Experts hold about 121 B of the 126 B parameters; a token uses 10 of 512 per layer, about 2 % (inferred).</text><text class="m" x="20" y="345" text-anchor="start">Routed experts are shipped in NVFP4 (4-bit values, a scale per 16); everything else in the backbone is BF16.</text></svg>