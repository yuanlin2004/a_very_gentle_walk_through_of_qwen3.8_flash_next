<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Gated DeltaNet layer: projections, a causal convolution and l2 norm, a decay g and step size beta per value head, the delta-rule update of the state matrix S, readout with q, gated norm and output projection"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="20" y="189" width="100" height="62" rx="6"/><text class="t" x="70.0" y="213.0" text-anchor="middle">x</text><text class="m" x="70.0" y="235.0" text-anchor="middle">2,560</text><rect class="ok" x="140" y="33" width="210" height="84" rx="6"/><text class="t" x="245.0" y="57.0" text-anchor="middle">q, k, v projection</text><text class="m" x="245.0" y="79.0" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">qkv</tspan> 10,240 × 2,560</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="245.0" y="101.0" text-anchor="middle">q, k: 16 × 128; v: 48 × 128</text><rect class="ok" x="140" y="131.5" width="210" height="62" rx="6"/><text class="t" x="245.0" y="155.5" text-anchor="middle">z projection</text><text class="m" x="245.0" y="177.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">z</tspan> 6,144 × 2,560</text><rect class="ok" x="140" y="211.5" width="210" height="62" rx="6"/><text class="t" x="245.0" y="235.5" text-anchor="middle">a, b projections</text><text class="m" x="245.0" y="257.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">a</tspan>, W<tspan baseline-shift="sub" font-size="75%">b</tspan> 48 × 2,560</text><polyline class="ar" points="120,220 130,220 130,75 138,75" marker-end="url(#ah3)"/><polyline class="ar" points="120,220 130,220 130,162 138,162" marker-end="url(#ah3)"/><polyline class="ar" points="120,220 130,220 130,242 138,242" marker-end="url(#ah3)"/><rect class="ok" x="365" y="22" width="210" height="106" rx="6"/><text class="t" x="470.0" y="46.0" text-anchor="middle">causal conv, width 4</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="470.0" y="68.0" text-anchor="middle">per channel, taps t−3..t</text><text class="m" x="470.0" y="90.0" text-anchor="middle">silu, then l2-normalize</text><text class="m" x="470.0" y="112.0" text-anchor="middle">each q and k head</text><polyline class="ar" points="350,75 363,75" marker-end="url(#ah3)"/><rect class="ok" x="365" y="197" width="225" height="106" rx="6"/><text class="t" x="477.5" y="221.0" text-anchor="middle">per value head h</text><text class="m" x="477.5" y="243.0" text-anchor="middle">decay g<tspan baseline-shift="sub" font-size="75%">h</tspan> = −exp(A<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><text class="m" x="477.5" y="265.0" text-anchor="middle">  · softplus(a<tspan baseline-shift="sub" font-size="75%">h</tspan> + dt<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><text class="m" x="477.5" y="287.0" text-anchor="middle">step β<tspan baseline-shift="sub" font-size="75%">h</tspan> = σ(b<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><polyline class="ar" points="350,242 363,242" marker-end="url(#ah3)"/><rect class="ok" x="605" y="91" width="250" height="128" rx="6"/><text textLength="238" lengthAdjust="spacingAndGlyphs" class="t" x="730.0" y="115.0" text-anchor="middle">delta rule (per value head)</text><text textLength="226" lengthAdjust="spacingAndGlyphs" class="m" x="730.0" y="137.0" text-anchor="middle">01 Decay · S ← e<tspan baseline-shift="super" font-size="75%">g</tspan> · S</text><text textLength="226" lengthAdjust="spacingAndGlyphs" class="m" x="730.0" y="159.0" text-anchor="middle">02 Correct · S ← S + β (v − S k̂) k̂ᵀ</text><text textLength="226" lengthAdjust="spacingAndGlyphs" class="m" x="730.0" y="181.0" text-anchor="middle">03 Read · o = S q̂ / √128</text><text class="m" x="730.0" y="203.0" text-anchor="middle">head h uses q, k head ⌊h/3⌋</text><polyline class="ar" points="575,75 595,75 595,130 603,130" marker-end="url(#ah3)"/><text class="al" x="630" y="68" text-anchor="middle">q̂, k̂, v</text><polyline class="ar" points="590,242 597,242 597,180 603,180" marker-end="url(#ah3)"/><text class="al" x="604" y="232" text-anchor="start">g, β</text><rect class="st" x="605" y="253" width="250" height="84" rx="6"/><text class="t" x="730.0" y="277.0" text-anchor="middle">state S</text><text class="m" x="730.0" y="299.0" text-anchor="middle">48 heads × 128 × 128, fp32</text><text class="m" x="730.0" y="321.0" text-anchor="middle">carried from token to token</text><polyline class="ar" points="700,258 700,217" marker-end="url(#ah3)"/><polyline class="ar" points="760,217 760,258" marker-end="url(#ah3)"/><rect class="ok" x="885" y="95" width="195" height="90" rx="6"/><text class="t" x="982.5" y="122.0" text-anchor="middle">gated norm</text><text class="m" x="982.5" y="144.0" text-anchor="middle">RMSNorm<tspan baseline-shift="sub" font-size="75%">128</tspan>(o<tspan baseline-shift="sub" font-size="75%">h</tspan>) · w</text><text class="m" x="982.5" y="166.0" text-anchor="middle">⊙ σ(z<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><polyline class="ar" points="855,140 883,140" marker-end="url(#ah3)"/><text class="al" x="868" y="132" text-anchor="middle">o</text><polyline class="ar" points="350,162 358,162 358,190 600,190 600,345 980,345 980,187" marker-end="url(#ah3)"/><text class="al" x="960" y="337" text-anchor="middle">z</text><rect class="ok" x="885" y="369" width="195" height="62" rx="6"/><text class="t" x="982.5" y="393.0" text-anchor="middle">output projection</text><text class="m" x="982.5" y="415.0" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">out</tspan> 2,560 × 6,144</text><polyline class="ar" points="1060,185 1060,368" marker-end="url(#ah3)"/><text textLength="200" lengthAdjust="spacingAndGlyphs" class="al" x="885" y="455" text-anchor="start">y = W<tspan baseline-shift="sub" font-size="75%">out</tspan> · concat<tspan baseline-shift="sub" font-size="75%">h</tspan>(...), 2,560</text><text class="m" x="20" y="395" text-anchor="start">Linear attention with a learned forget gate: S is a 128 × 128 associative memory per value head.</text><text class="m" x="20" y="413" text-anchor="start">Each token decays it by e<tspan baseline-shift="super" font-size="75%">g</tspan> (g ≤ 0), then writes v at key k̂, moving S&#x27;s current answer for k̂</text><text class="m" x="20" y="431" text-anchor="start">toward v by a fraction β. Reading with q̂ costs the same at any context length.</text></svg>