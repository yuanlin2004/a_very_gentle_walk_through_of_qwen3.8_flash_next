<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Gated DeltaNet layer: projections, a causal convolution and l2 norm, a decay g and step size beta per value head, the delta-rule update of the state matrix S, readout with q, gated norm and output projection"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 11px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 13px Helvetica,Arial,sans-serif}text.m{font:11px Menlo,monospace;fill:#5a6476}text.al{font:11px Menlo,monospace;fill:#2c56c9}text.gt{font:600 13px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="20" y="190" width="100" height="60" rx="6"/><text class="t" x="70.0" y="216.5" text-anchor="middle">x</text><text class="m" x="70.0" y="231.5" text-anchor="middle">2,560</text><rect class="ok" x="140" y="40" width="210" height="70" rx="6"/><text class="t" x="245.0" y="64.0" text-anchor="middle">q, k, v projection</text><text class="m" x="245.0" y="79.0" text-anchor="middle">W_qkv 10,240 × 2,560</text><text class="m" x="245.0" y="94.0" text-anchor="middle">q, k: 16 × 128; v: 48 × 128</text><rect class="ok" x="140" y="135" width="210" height="55" rx="6"/><text class="t" x="245.0" y="159.0" text-anchor="middle">z projection</text><text class="m" x="245.0" y="174.0" text-anchor="middle">W_z 6,144 × 2,560</text><rect class="ok" x="140" y="215" width="210" height="55" rx="6"/><text class="t" x="245.0" y="239.0" text-anchor="middle">a, b projections</text><text class="m" x="245.0" y="254.0" text-anchor="middle">W_a, W_b 48 × 2,560</text><polyline class="ar" points="120,220 130,220 130,75 138,75" marker-end="url(#ah3)"/><polyline class="ar" points="120,220 130,220 130,162 138,162" marker-end="url(#ah3)"/><polyline class="ar" points="120,220 130,220 130,242 138,242" marker-end="url(#ah3)"/><rect class="ok" x="365" y="30" width="210" height="90" rx="6"/><text class="t" x="470.0" y="56.5" text-anchor="middle">causal conv, width 4</text><text class="m" x="470.0" y="71.5" text-anchor="middle">per channel, taps t−3..t</text><text class="m" x="470.0" y="86.5" text-anchor="middle">silu, then l2-normalize</text><text class="m" x="470.0" y="101.5" text-anchor="middle">each q and k head</text><polyline class="ar" points="350,75 363,75" marker-end="url(#ah3)"/><rect class="ok" x="365" y="205" width="225" height="90" rx="6"/><text class="t" x="477.5" y="231.5" text-anchor="middle">per value head h</text><text class="m" x="477.5" y="246.5" text-anchor="middle">decay g_h = −exp(A_h)</text><text class="m" x="477.5" y="261.5" text-anchor="middle">  · softplus(a_h + dt_h)</text><text class="m" x="477.5" y="276.5" text-anchor="middle">step β_h = σ(b_h)</text><polyline class="ar" points="350,242 363,242" marker-end="url(#ah3)"/><rect class="ok" x="605" y="95" width="250" height="120" rx="6"/><text class="t" x="730.0" y="129.0" text-anchor="middle">delta rule (per value head)</text><text class="m" x="730.0" y="144.0" text-anchor="middle">S ← e^g · S</text><text class="m" x="730.0" y="159.0" text-anchor="middle">S ← S + β (v − S k̂) k̂ᵀ</text><text class="m" x="730.0" y="174.0" text-anchor="middle">o = S q̂ / √128</text><text class="m" x="730.0" y="189.0" text-anchor="middle">head h uses q, k head ⌊h/3⌋</text><polyline class="ar" points="575,75 595,75 595,130 603,130" marker-end="url(#ah3)"/><text class="al" x="630" y="68" text-anchor="middle">q̂, k̂, v</text><polyline class="ar" points="590,242 597,242 597,180 603,180" marker-end="url(#ah3)"/><text class="al" x="604" y="232" text-anchor="start">g, β</text><rect class="st" x="605" y="260" width="250" height="70" rx="6"/><text class="t" x="730.0" y="284.0" text-anchor="middle">state S</text><text class="m" x="730.0" y="299.0" text-anchor="middle">48 heads × 128 × 128, fp32</text><text class="m" x="730.0" y="314.0" text-anchor="middle">carried from token to token</text><polyline class="ar" points="700,258 700,217" marker-end="url(#ah3)"/><polyline class="ar" points="760,217 760,258" marker-end="url(#ah3)"/><rect class="ok" x="885" y="95" width="195" height="90" rx="6"/><text class="t" x="982.5" y="129.0" text-anchor="middle">gated norm</text><text class="m" x="982.5" y="144.0" text-anchor="middle">RMSNorm_128(o_h) · w</text><text class="m" x="982.5" y="159.0" text-anchor="middle">⊙ σ(z_h)</text><polyline class="ar" points="855,140 883,140" marker-end="url(#ah3)"/><text class="al" x="868" y="132" text-anchor="middle">o</text><polyline class="ar" points="350,162 358,162 358,190 600,190 600,345 980,345 980,187" marker-end="url(#ah3)"/><text class="al" x="960" y="337" text-anchor="middle">z</text><rect class="ok" x="885" y="370" width="195" height="60" rx="6"/><text class="t" x="982.5" y="396.5" text-anchor="middle">output projection</text><text class="m" x="982.5" y="411.5" text-anchor="middle">W_out 2,560 × 6,144</text><polyline class="ar" points="1060,185 1060,368" marker-end="url(#ah3)"/><text class="al" x="885" y="455" text-anchor="start">y = W_out · concat_h(...), 2,560</text><text class="m" x="20" y="395" text-anchor="start">Linear attention with a learned forget gate: S is a 128 × 128 associative memory per value head.</text><text class="m" x="20" y="413" text-anchor="start">Each token decays it by e^g (g ≤ 0), then writes v at key k̂, moving S&#x27;s current answer for k̂</text><text class="m" x="20" y="431" text-anchor="start">toward v by a fraction β. Reading with q̂ costs the same at any context length.</text></svg>