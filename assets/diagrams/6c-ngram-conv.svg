<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" role="img" aria-label="Dilated convolution over the n-gram stream: at position t, each of the 10,240 channels sums its own four learned weights times the normalized gated values at t, t minus 3, t minus 6 and t minus 9, then applies silu"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="40" y="55" width="52" height="40" rx="6"/><text class="t" x="66.0" y="79.0" text-anchor="middle">t−15</text><rect class="dat" x="104" y="55" width="52" height="40" rx="6"/><text class="t" x="130.0" y="79.0" text-anchor="middle">t−14</text><rect class="dat" x="168" y="55" width="52" height="40" rx="6"/><text class="t" x="194.0" y="79.0" text-anchor="middle">t−13</text><rect class="dat" x="232" y="55" width="52" height="40" rx="6"/><text class="t" x="258.0" y="79.0" text-anchor="middle">t−12</text><rect class="dat" x="296" y="55" width="52" height="40" rx="6"/><text class="t" x="322.0" y="79.0" text-anchor="middle">t−11</text><rect class="dat" x="360" y="55" width="52" height="40" rx="6"/><text class="t" x="386.0" y="79.0" text-anchor="middle">t−10</text><rect class="ok" x="424" y="55" width="52" height="40" rx="6"/><text class="t" x="450.0" y="79.0" text-anchor="middle">t−9</text><polyline class="ar" points="450,95 450,125 870,125 870,148" marker-end="url(#ah8)"/><rect class="dat" x="488" y="55" width="52" height="40" rx="6"/><text class="t" x="514.0" y="79.0" text-anchor="middle">t−8</text><rect class="dat" x="552" y="55" width="52" height="40" rx="6"/><text class="t" x="578.0" y="79.0" text-anchor="middle">t−7</text><rect class="ok" x="616" y="55" width="52" height="40" rx="6"/><text class="t" x="642.0" y="79.0" text-anchor="middle">t−6</text><polyline class="ar" points="642,95 642,125 870,125 870,148" marker-end="url(#ah8)"/><rect class="dat" x="680" y="55" width="52" height="40" rx="6"/><text class="t" x="706.0" y="79.0" text-anchor="middle">t−5</text><rect class="dat" x="744" y="55" width="52" height="40" rx="6"/><text class="t" x="770.0" y="79.0" text-anchor="middle">t−4</text><rect class="ok" x="808" y="55" width="52" height="40" rx="6"/><text class="t" x="834.0" y="79.0" text-anchor="middle">t−3</text><polyline class="ar" points="834,95 834,125 870,125 870,148" marker-end="url(#ah8)"/><rect class="dat" x="872" y="55" width="52" height="40" rx="6"/><text class="t" x="898.0" y="79.0" text-anchor="middle">t−2</text><rect class="dat" x="936" y="55" width="52" height="40" rx="6"/><text class="t" x="962.0" y="79.0" text-anchor="middle">t−1</text><rect class="ok" x="1000" y="55" width="52" height="40" rx="6"/><text class="t" x="1026.0" y="79.0" text-anchor="middle">t</text><polyline class="ar" points="1026,95 1026,125 870,125 870,148" marker-end="url(#ah8)"/><rect class="ok" x="720" y="150" width="300" height="55" rx="6"/><text class="t" x="870.0" y="174.0" text-anchor="middle">c<tspan baseline-shift="sub" font-size="75%">t</tspan> = silu(Σ<tspan baseline-shift="sub" font-size="75%">j</tspan> w<tspan baseline-shift="sub" font-size="75%">j</tspan> · un(t − 3j))</text><text class="m" x="870.0" y="189.0" text-anchor="middle">j = 0..3, each channel its own w</text><text class="al" x="40" y="35" text-anchor="start">un: the normalized gated n-gram value of each lane (10,240 channels), kept for the last 9 positions</text><text class="m" x="40" y="240" text-anchor="start">Each output sees n-grams ending at t, t−3, t−6 and t−9, so tokens back to t−11 can reach it (inferred).</text></svg>