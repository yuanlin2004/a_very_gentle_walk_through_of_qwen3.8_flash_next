<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-label="QSA layer: query with output gate, two key-value heads, normalized and partially rotated; a small indexer scores 4-token blocks of the past and keeps the top 512 blocks plus the current partial block; softmax attention over at most 2,051 keys; sigmoid output gate; output projection"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="dat" x="20" y="199" width="100" height="62" rx="6"/><text class="t" x="70.0" y="223" text-anchor="middle">x</text><text class="m" x="70.0" y="245" text-anchor="middle">2,560</text><rect class="ok" x="150" y="25.5" width="210" height="84" rx="6"/><text class="t" x="255.0" y="49.5" text-anchor="middle">query + gate</text><text class="m" x="255.0" y="71.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">q</tspan> 12,288 × 2,560</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="255.0" y="93.5" text-anchor="middle">24 heads × (256 q | 256 gate)</text><rect class="ok" x="150" y="124" width="210" height="62" rx="6"/><text class="t" x="255.0" y="148" text-anchor="middle">key, value</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="255.0" y="170" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">k</tspan>, W<tspan baseline-shift="sub" font-size="75%">v</tspan> 512 × 2,560: 2 heads</text><rect class="ok" x="140" y="295.5" width="230" height="84" rx="6"/><text class="t" x="255.0" y="319.5" text-anchor="middle">indexer projection</text><text class="m" x="255.0" y="341.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">ix</tspan> 640 × 2,560</text><text textLength="218" lengthAdjust="spacingAndGlyphs" class="m" x="255.0" y="363.5" text-anchor="middle">4 query + 1 key heads of 128</text><polyline class="ar" points="120,230 135,230 135,67 148,67" marker-end="url(#ah4)"/><polyline class="ar" points="120,230 135,230 135,155 148,155" marker-end="url(#ah4)"/><polyline class="ar" points="120,230 135,230 135,337 148,337" marker-end="url(#ah4)"/><rect class="ok" x="390" y="30" width="210" height="155" rx="6"/><text textLength="198" lengthAdjust="spacingAndGlyphs" class="t" x="495.0" y="67.5" text-anchor="middle">RMSNorm ·(1+w) per head</text><text class="m" x="495.0" y="89.5" text-anchor="middle">RoPE on dims 0..63</text><text class="m" x="495.0" y="111.5" text-anchor="middle">(θ = 10⁷, position t)</text><text class="m" x="495.0" y="133.5" text-anchor="middle"></text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="495.0" y="155.5" text-anchor="middle">V is not normed or rotated</text><polyline class="ar" points="360,67 388,67" marker-end="url(#ah4)"/><polyline class="ar" points="360,155 388,155" marker-end="url(#ah4)"/><rect class="st" x="630" y="110.5" width="200" height="84" rx="6"/><text class="t" x="730.0" y="134.5" text-anchor="middle">key/value cache</text><text class="m" x="730.0" y="156.5" text-anchor="middle">2 heads × (K, V) × 256</text><text class="m" x="730.0" y="178.5" text-anchor="middle">every past token</text><polyline class="ar" points="600,155 628,155" marker-end="url(#ah4)"/><text class="al" x="614" y="147" text-anchor="middle">K, V</text><rect class="ok" x="390" y="284.5" width="210" height="106" rx="6"/><text class="t" x="495.0" y="308.5" text-anchor="middle">block keys</text><text class="m" x="495.0" y="330.5" text-anchor="middle">every 4 tokens: mean of</text><text class="m" x="495.0" y="352.5" text-anchor="middle">their indexer keys,</text><text class="m" x="495.0" y="374.5" text-anchor="middle">norm + RoPE → c<tspan baseline-shift="sub" font-size="75%">b</tspan></text><polyline class="ar" points="370,337 388,337" marker-end="url(#ah4)"/><rect class="ok" x="625" y="284.5" width="235" height="106" rx="6"/><text class="t" x="742.5" y="308.5" text-anchor="middle">block selection</text><text textLength="223" lengthAdjust="spacingAndGlyphs" class="m" x="742.5" y="330.5" text-anchor="middle">score<tspan baseline-shift="sub" font-size="75%">b</tspan> = Σ<tspan baseline-shift="sub" font-size="75%">h</tspan> ReLU(q<tspan baseline-shift="sub" font-size="75%">h</tspan>·c<tspan baseline-shift="sub" font-size="75%">b</tspan>) / √128</text><text class="m" x="742.5" y="352.5" text-anchor="middle">keep top 512 blocks</text><text class="m" x="742.5" y="374.5" text-anchor="middle">(all, if 512 or fewer)</text><polyline class="ar" points="600,337 623,337" marker-end="url(#ah4)"/><text class="al" x="611" y="329" text-anchor="middle">c<tspan baseline-shift="sub" font-size="75%">b</tspan></text><rect class="st" x="630" y="204" width="200" height="62" rx="6"/><text class="t" x="730.0" y="228" text-anchor="middle">block keys c<tspan baseline-shift="sub" font-size="75%">b</tspan></text><text class="m" x="730.0" y="250" text-anchor="middle">one per 4 past tokens</text><polyline class="ar" points="515,290 515,235 628,235" marker-end="url(#ah4)"/><polyline class="ar" points="730,265 730,288" marker-end="url(#ah4)"/><rect class="ok" x="860" y="85" width="220" height="150" rx="6"/><text class="t" x="970.0" y="109" text-anchor="middle">sparse attention</text><text textLength="208" lengthAdjust="spacingAndGlyphs" class="m" x="970.0" y="131" text-anchor="middle">keys: 4 tokens per chosen</text><text textLength="208" lengthAdjust="spacingAndGlyphs" class="m" x="970.0" y="153" text-anchor="middle">block + current partial block</text><text class="m" x="970.0" y="175" text-anchor="middle">≤ 512·4 + 3 = 2,051 keys</text><text class="m" x="970.0" y="197" text-anchor="middle">softmax(q·K/16) · V</text><text textLength="208" lengthAdjust="spacingAndGlyphs" class="m" x="970.0" y="219" text-anchor="middle">q head h uses KV head ⌊h/12⌋</text><polyline class="ar" points="600,67 970,67 970,98" marker-end="url(#ah4)"/><text class="al" x="780" y="59" text-anchor="middle">q (24 heads), gate</text><polyline class="ar" points="830,155 858,155" marker-end="url(#ah4)"/><polyline class="ar" points="860,320 900,320 900,222" marker-end="url(#ah4)"/><text class="al" x="905" y="300" text-anchor="start">chosen</text><rect class="ok" x="860" y="244" width="220" height="62" rx="6"/><text class="t" x="970.0" y="268" text-anchor="middle">output gate</text><text class="m" x="970.0" y="290" text-anchor="middle">o<tspan baseline-shift="sub" font-size="75%">h</tspan> ⊙ σ(gate<tspan baseline-shift="sub" font-size="75%">h</tspan>)</text><polyline class="ar" points="1000,220 1000,248" marker-end="url(#ah4)"/><rect class="ok" x="860" y="396.5" width="220" height="62" rx="6"/><text class="t" x="970.0" y="420.5" text-anchor="middle">output projection</text><text class="m" x="970.0" y="442.5" text-anchor="middle">W<tspan baseline-shift="sub" font-size="75%">o</tspan> 2,560 × 6,144</text><polyline class="ar" points="1000,300 1000,398" marker-end="url(#ah4)"/><text textLength="225" lengthAdjust="spacingAndGlyphs" class="al" x="860" y="480" text-anchor="start">y = W<tspan baseline-shift="sub" font-size="75%">o</tspan> · concat<tspan baseline-shift="sub" font-size="75%">h</tspan>(...), 2,560</text><text class="m" x="20" y="420" text-anchor="start">Attention cost per token is bounded: at most 2,051 keys are read whatever the context,</text><text class="m" x="20" y="438" text-anchor="start">while the indexer&#x27;s cheap 128-wide scores pick which 4-token blocks matter.</text></svg>