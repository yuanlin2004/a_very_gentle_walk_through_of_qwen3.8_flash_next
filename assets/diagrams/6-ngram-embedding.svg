<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-label="n-gram embedding: 16 hash ids from the last three tokens pick 16 rows of a 320-million-row table; the gathered vector becomes a value and per-lane keys; each lane gates the value by how well its key matches the current residual lane; a norm and a dilated causal convolution follow; the sum is added to the residual"><rect width="100%" height="100%" fill="#ffffff"/><style>rect.ok{fill:#e5f3ea;stroke:#2f7d4f;stroke-width:1.5}rect.ref{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.mix{fill:#e5f3ea;stroke:#a86a12;stroke-width:1.5;stroke-dasharray:5 3}rect.wt{fill:#eceefa;stroke:#5b5f9e;stroke-width:1.5}rect.dat{fill:#fff;stroke:#c9cfda;stroke-width:1.5}rect.host2{fill:#eef0f3;stroke:#6b7280;stroke-width:1.5}rect.st{fill:#fbf0dc;stroke:#a86a12;stroke-width:1.5}rect.spec{fill:none;stroke:#5a6476;stroke-width:1.5;stroke-dasharray:3 3}rect.bar{fill:#2c56c9}rect.bar2{fill:#b0245e}text.tm{font:600 14px Menlo,monospace;fill:#b0245e}rect.grp{fill:none;stroke:#5a6476;stroke-width:1;stroke-dasharray:2 4}text{fill:#1b2333}text.t{font:600 17px Helvetica,Arial,sans-serif}text.m{font:14px Menlo,monospace;fill:#5a6476}text.al{font:14px Menlo,monospace;fill:#2c56c9}text.gt{font:600 17px Helvetica,Arial,sans-serif;fill:#5a6476}polyline.ar{fill:none;stroke:#1b2333;stroke-width:1.3}polyline.dash{stroke-dasharray:6 4;stroke:#2c56c9}.ahp{fill:#1b2333}</style><defs><marker id="ah6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker></defs><rect class="host2" x="15" y="40" width="170" height="75" rx="6"/><text class="t" x="100.0" y="66.5" text-anchor="middle">tokens</text><text class="m" x="100.0" y="81.5" text-anchor="middle">x<tspan baseline-shift="sub" font-size="75%">t−2</tspan>, x<tspan baseline-shift="sub" font-size="75%">t−1</tspan>, x<tspan baseline-shift="sub" font-size="75%">t</tspan></text><text class="m" x="100.0" y="96.5" text-anchor="middle">EOS resets history</text><rect class="ok" x="200" y="30" width="210" height="95" rx="6"/><text class="t" x="305.0" y="59.0" text-anchor="middle">16 hash ids</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="305.0" y="74.0" text-anchor="middle">heads 0-7: bigram (t−1, t)</text><text class="m" x="305.0" y="89.0" text-anchor="middle">heads 8-15: trigram</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="305.0" y="104.0" text-anchor="middle">id = (mix mod P<tspan baseline-shift="sub" font-size="75%">h</tspan>) + offset<tspan baseline-shift="sub" font-size="75%">h</tspan></text><polyline class="ar" points="185,77 198,77" marker-end="url(#ah6)"/><rect class="wt" x="440" y="30" width="210" height="95" rx="6"/><text class="t" x="545.0" y="59.0" text-anchor="middle">n-gram table</text><text class="m" x="545.0" y="74.0" text-anchor="middle">≈ 320 M rows × 160 FP8</text><text textLength="198" lengthAdjust="spacingAndGlyphs" class="m" x="545.0" y="89.0" text-anchor="middle">51.2 GB, one row per head</text><text class="m" x="545.0" y="104.0" text-anchor="middle">per token: 16 rows</text><polyline class="ar" points="410,77 438,77" marker-end="url(#ah6)"/><rect class="dat" x="680" y="40" width="140" height="75" rx="6"/><text class="t" x="750.0" y="74.0" text-anchor="middle">e</text><text textLength="128" lengthAdjust="spacingAndGlyphs" class="m" x="750.0" y="89.0" text-anchor="middle">16 × 160 = 2,560</text><polyline class="ar" points="650,77 678,77" marker-end="url(#ah6)"/><rect class="ok" x="150" y="190" width="220" height="70" rx="6"/><text class="t" x="260.0" y="214.0" text-anchor="middle">keys per lane</text><text class="m" x="260.0" y="229.0" text-anchor="middle">K = W<tspan baseline-shift="sub" font-size="75%">key</tspan> e, 4 × 2,560</text><text class="m" x="260.0" y="244.0" text-anchor="middle">norm per lane ·(1+w)</text><rect class="ok" x="150" y="290" width="220" height="55" rx="6"/><text class="t" x="260.0" y="314.0" text-anchor="middle">value</text><text class="m" x="260.0" y="329.0" text-anchor="middle">V = W<tspan baseline-shift="sub" font-size="75%">val</tspan> e, 2,560</text><polyline class="ar" points="750,115 750,150 120,150 120,225 148,225" marker-end="url(#ah6)"/><polyline class="ar" points="120,225 120,317 148,317" marker-end="url(#ah6)"/><rect class="ok" x="400" y="190" width="230" height="70" rx="6"/><text class="t" x="515.0" y="214.0" text-anchor="middle">queries per lane</text><text class="m" x="515.0" y="229.0" text-anchor="middle">Q<tspan baseline-shift="sub" font-size="75%">i</tspan> = norm(R<tspan baseline-shift="sub" font-size="75%">i</tspan>) ·(1+w)</text><text class="m" x="515.0" y="244.0" text-anchor="middle">R: the residual lanes</text><rect class="ok" x="660" y="190" width="230" height="110" rx="6"/><text class="t" x="775.0" y="226.5" text-anchor="middle">gate per lane i</text><text class="m" x="775.0" y="241.5" text-anchor="middle">g = ⟨K<tspan baseline-shift="sub" font-size="75%">i</tspan>, Q<tspan baseline-shift="sub" font-size="75%">i</tspan>⟩ / √2560</text><text class="m" x="775.0" y="256.5" text-anchor="middle">g ← sign(g) √|g|</text><text class="m" x="775.0" y="271.5" text-anchor="middle">u<tspan baseline-shift="sub" font-size="75%">i</tspan> = σ(g) · V</text><polyline class="ar" points="370,225 385,225 385,170 775,170 775,188" marker-end="url(#ah6)"/><polyline class="ar" points="630,225 658,225" marker-end="url(#ah6)"/><polyline class="ar" points="370,317 645,317 645,280 658,280" marker-end="url(#ah6)"/><rect class="ok" x="660" y="330" width="230" height="85" rx="6"/><text textLength="218" lengthAdjust="spacingAndGlyphs" class="t" x="775.0" y="354.0" text-anchor="middle">norm + dilated causal conv</text><text class="m" x="775.0" y="369.0" text-anchor="middle">per lane ·(1+w), then</text><text textLength="218" lengthAdjust="spacingAndGlyphs" class="m" x="775.0" y="384.0" text-anchor="middle">taps t, t−3, t−6, t−9, silu</text><text class="m" x="775.0" y="399.0" text-anchor="middle">→ c<tspan baseline-shift="sub" font-size="75%">i</tspan></text><polyline class="ar" points="775,300 775,328" marker-end="url(#ah6)"/><rect class="ok" x="920" y="250" width="160" height="85" rx="6"/><text class="t" x="1000.0" y="281.5" text-anchor="middle">add</text><text class="m" x="1000.0" y="296.5" text-anchor="middle">R<tspan baseline-shift="sub" font-size="75%">i</tspan> += u<tspan baseline-shift="sub" font-size="75%">i</tspan> + c<tspan baseline-shift="sub" font-size="75%">i</tspan></text><text class="m" x="1000.0" y="311.5" text-anchor="middle">each lane</text><polyline class="ar" points="890,245 905,245 905,280 918,280" marker-end="url(#ah6)"/><polyline class="ar" points="890,372 905,372 905,310 918,310" marker-end="url(#ah6)"/><text class="m" x="20" y="380" text-anchor="start">Placed once, at the start of layer 1, before its token mixer.</text><text class="m" x="20" y="398" text-anchor="start">It adds a memory lookup keyed on the last 2 or 3 tokens; the table</text><text class="m" x="20" y="416" text-anchor="start">is about 40 % of the bytes on disk but costs 16 rows per token (inferred).</text></svg>